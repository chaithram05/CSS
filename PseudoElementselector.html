<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2::before{
            content:"Ms.";
        }
         h2::after{
            content:" is a good girl";
         }
         p::selection{
            background-color: aquamarine;
            color:blue;
         }
         li::marker{
            content:"💕"
         }
        p::first-line{
            color:blueviolet;
        }
        h2::first-letter{
            font-size: 40px;
            color:orange;
        }
    </style>
</head>
<body>
    <h2>Chaithra</h2>
    <p>Myself chaithra presently pursuing BCA at BGS Mysore University</p>
    <ol>
        <li>Apple</li>
        <li>Orange</li>
        <li>Mango</li>
        <li>Pomogranate</li>
        <li>Papaya</li>
    </ol>
</body>
</html>
