<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Parent{
            height: 500px;
            width: 400px;
            border-width: 2px;
            border-style: solid;
            border-color: red;
            display:flex;
            align-items: center;
            justify-content: space-evenly ;
            flex-wrap: wrap;
            margin: 100px auto;

        }
        .child{
            height: 100px;
            width:100px;
        }
        #child1{
            border: 10px solid rebeccapurple;
            border-top-right-radius: 20px;
        }
        #child2{
            border: 10px dotted blue;
            border-radius: 50px;
            
            box-shadow: 10px 10px 10px blueviolet;
        }
        #child3{
            border: 10px dashed blue;

        }
        #child4{
            border:10px double maroon;
        }
        #child5{
            border: 10px groove green;
        }
        #child6{
            border:10px ridge palevioletred;
        }
        #child7{
            border: 10px inset hotpink;
        }
        #child8{
            border: 10px outset khaki;
        }
        #child9{
            border-top: 10px dashed red;
            border-left: 10px solid blue;
            border-right: 10px dotted khaki;
            border-bottom: 10px double maroon;
        }
    </style>
</head>
<body>
    <section class="Parent">
    <article class="child" id="child1"></article>
    <article class="child" id="child2"></article>
    <article class="child" id="child3"></article>
    <article class="child" id="child4"></article>
    <article class="child" id="child5"></article>
    <article class="child" id="child6"></article>
    <article class="child" id="child7"></article>
    <article class="child" id="child8"></article>
    <article class="child" id="child9"></article>
    </section>

</body>
</html>
