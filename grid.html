<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            height:400px;
            width:600px;
            border:2px solid;
            display:grid;
            grid-template-columns: repeat(3,100px);
            grid-template-rows: repeat(3,100px);
            /* gap:10px 20px; */
            column-gap: 50px;
            row-gap: 40px;
            align-content: center;
            justify-content: space-evenly;
        }
        aside{
            border:2px solid;
        }
    </style>
</head>
<body>
    <section>
    <aside id="child1">1</aside>
    <aside id="child2">2</aside>
    <aside id="child3">3</aside>
    <aside id="child4">4</aside>
    <aside id="child5">5</aside>
    <aside id="child6">6</aside>
    <aside id="child7">7</aside>
    <aside id="child8">8</aside>
    <aside id="child9">9</aside>
    </section>
</body>
</html>
